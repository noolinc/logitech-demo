isolation = "worktree"
verdict_binding = "toolchain"
mutation_budget_secs = 300
max_mutants = 3

[reification.dependencies]
proto = [
    "ts",
    "ex",
]

[analysis]
ast_enabled = true
generated_paths = [
    "*.min.js",
    "*.min.css",
    "assets/",
    "vendor/",
    "node_modules/",
    "target/",
    "dist/",
    "*.lock",
]
field_signal = false

[workflow]

[try]
mode = "shared"
max_worktrees = 64
lease_ttl_ms = 1800000
reclaim_worktree_after_ms = 86400000
