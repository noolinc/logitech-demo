# Dependency edges gate build/release/contract order across projects.
# `from` depends `on` another project; `kind` controls how it gates:
#   build    — `from` must be built after `on`
#   release  — `from` must not release until `on` has released (default)
#   contract — shared schema/API contract spanning the two projects
#
# [[workspace.depends]]
# from = "agent-vision"
# on = "nool"
# kind = "release"


# Dependency edges — declared cross-repo coupling
# Firmware group consumes the protocol lib and the contracts header.
[[workspace.depends]]
from = "mouse-fw"
on = "mcu-protocol"
kind = "build"

[[workspace.depends]]
from = "keyboard-fw"
on = "mcu-protocol"
kind = "build"

[[workspace.depends]]
from = "receiver-fw"
on = "mcu-protocol"
kind = "build"

[[workspace.depends]]
from = "mcu-protocol"
on = "contracts"
kind = "contract"

[[workspace.depends]]
from = "hal-core"
on = "contracts"
kind = "build"

# Cloud services consume the same TLV contract.
[[workspace.depends]]
from = "svc-gateway"
on = "contracts"
kind = "contract"

[[workspace.depends]]
from = "svc-ota"
on = "mouse-fw"
kind = "release"

[[workspace.depends]]
from = "svc-insights"
on = "svc-gateway"
kind = "build"
