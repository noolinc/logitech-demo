# Nool workspace configuration
#
# Declares the fractal coordination topology for a polyglot workspace of
# nested Nool projects (Org → Dept → Team → Project). Read by every
# `nool workspace <subcommand>`. Unlike a [workspace] section inside
# nool.toml — which NoolConfig silently drops on round-trip — this file is
# the durable home for workspace declarations and is never rewritten by Nool.
#
# Tips:
#   - Discovery is convention-based: any directory containing a `.nool/` is
#     treated as a project automatically. You only need [workspace.projects]
#     entries to OVERRIDE convention (custom path/lang/release driver/remote/
#     branch) — discovered projects below are pre-populated as a starting point.
#   - Run `nool workspace doctor` after editing to catch stale declarations,
#     dangling edges, or dependency cycles.
#   - Run `nool workspace status` / `nool workspace visualize` to see how
#     these declarations reconcile against what's actually on disk.

# Org — Logitech (research sim). Owner = workspace authority; the default
# agent identity inherits downward unless a project declares its own.
[workspace]
owner = "arun@nool.dev"

# Discovered projects — adjust lang/release/remote/branch as needed:
[workspace.projects.svc-gateway]
path = "cloud/svc-gateway"
lang = "go"
release = "auto"
# release = "cargo"  # release driver override (cargo, npm, vercel, ...)
# remote = "origin"  # sync remote for `nool workspace pull` (default: origin)
# branch = "main"      # tracking branch surfaced in `workspace status` (default: main)

