inv_id: POL-SECRETS-001
title: No credentials or private keys in landed content
scope:
  type: global
kind: behavioral
severity: critical
mode: blocking
reason_code: 403
when:
  all_of:
    - not:
        semantic_path_is_test: true
    - not:
        semantic_path_matches: "^policies/"
forbids:
  - semantic_path_matches: "(^|/)\\.env(\\.(local|dev|development|test|staging|prod|production))?(\\.local)?$"
  - semantic_path_matches: "\\.(pem|key|p12|pfx|jks)$"
  - diff_matches: "AKIA[0-9A-Z]{16}"
  - diff_matches: "ghp_[a-zA-Z0-9]{36}"
  - diff_matches: "sk-[a-zA-Z0-9]{32,64}"
  - diff_matches: "xox[baprs]-[0-9a-zA-Z]{10,48}"
  - diff_matches: "-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----"
controls: ["pci-dss:8.6.2"]
